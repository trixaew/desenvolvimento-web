<h1>Listas</h1>

<h2>Lista numerada</h2>
<!-- Texto comentado no HTML -->
<p>
    Linguagens de programação
 <ol>
    <li>Python</li>
    <li>Javascript</li>
    <li>Gol</li>
    <li>PHP</li>
    <li>C</li> <!-- define um item da lista-->
</ol>   <!-- (ol) define uma lista ordenada-->
</p>

<h2>Lista nao numerada</h2>

<p>
  Lista de compras:
  <ul>
    <li>Arroz</li>
    <li>Feijão</li>
    <li>Açucar</li>
    <li>Frutas</li> <!-- define um item da lista-->
  </ul> <!--(ul) define uma lista que nao é numerada-->
</p>

<h3>Lista de definições</h3>
<dl>
    <dt>HTML</dt>
    <dd>HyperText Markup Language</dd>
    <dt>JS</dt> <!--(dt) define um nome ou termo na lista de descrição-->
    <dd>Javascript</dd> <!--(dd) define a descrição ou valor de um termo na lista de descrição-->
</dl> <!-- (dl) lista de definiçoes/descrições-->
